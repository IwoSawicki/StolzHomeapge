# nginx-Konfiguration für die statische Astro-Site (Docker-Deployment).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # URLs ohne Trailing-Slash (astro.config: trailingSlash 'never',
    # Seiten liegen als /kontakt/index.html)
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Gehashte Build-Assets dürfen unbegrenzt gecacht werden
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Selbst gehostete Fonts
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml text/xml application/xml;
    gzip_min_length 1024;
}
