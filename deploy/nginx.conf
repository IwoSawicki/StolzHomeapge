# nginx-Konfiguration für die statische Astro-Site (Docker-Deployment).

# Die Redesign-Vorschau soll nicht in den Suchindex. Der Build ist für alle
# Umgebungen identisch, deshalb hängt die Entscheidung am tatsächlichen
# Host-Header und nicht am Build: nur redesign.stolz-marketing.de bekommt
# „noindex", stolz-marketing.de und dev.stolz-marketing.de bleiben unberührt.
# Bei leerem Wert setzt nginx den Header nicht — Produktion bekommt ihn also
# gar nicht erst.
map $host $robots_tag {
    default                      "";
    redesign.stolz-marketing.de  "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag $robots_tag always;

    # --- Adressen des bisherigen Auftritts -------------------------------
    # Diese Seiten gibt es im neuen Auftritt nicht mehr. 301 statt 404,
    # damit Google die Bewertung auf das Ziel überträgt statt sie zu
    # verlieren. /projekte/dmk-bau und /projekte/hepa-baut fehlen hier
    # bewusst: die beiden Adressen gibt es weiterhin.
    #
    # Regulärer Ausdruck statt „location =", und zwar aus zwei Gründen:
    # „/?$" fängt den abschließenden Schrägstrich ab (mit „location ="
    # lief /archiv/ in einen 404), und „~*" macht die Groß- und
    # Kleinschreibung egal. Beides ist bei Adressen wichtig, die von Hand
    # abgetippt, aus Druckstücken übernommen oder weitergeleitet werden.
    location ~* ^/archiv/?$ { return 301 /projekte; }
    location ~* ^/projekte/(jhoch2-wasserschaden|saan-wasserstrahl|pulse-vending|sen)/?$ {
        return 301 /projekte;
    }

    # QR-Code auf dem Flyer der Door-to-Door-Aktion.
    #
    # Die Weiterleitung liegt NICHT mehr hier, sondern als echte Seite im
    # Build (src/pages/korbaktion.astro). Der Grund: die Adresse steht
    # gedruckt und lässt sich nicht mehr ändern. Eine Datei im ausgelieferten
    # Verzeichnis wird auch dann gefunden, wenn diese Konfiguration einmal
    # nicht im Container ankommt — selbst die Standardkonfiguration von nginx
    # findet für einen Ordner die index.html.
    #
    # Die beiden exakten Regeln stehen nur da, um den regulären Ausdruck
    # darunter auszuhebeln: „location =" hat in nginx Vorrang vor jedem
    # regulären Ausdruck. Die Kleinschreibung landet damit auf der Seite,
    # jede andere Schreibweise auf der Weiterleitung.
    location = /korbaktion  { try_files /korbaktion/index.html =404; }
    location = /korbaktion/ { try_files /korbaktion/index.html =404; }
    location ~* ^/korbaktion/?$ {
        return 302 "/?utm_source=flyer&utm_medium=qr&utm_campaign=korbaktion";
    }

    # URLs ohne Trailing-Slash (astro.config: trailingSlash 'never',
    # Seiten liegen als /kontakt/index.html)
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Unbekannte Adressen bekommen die eigene 404-Seite statt der
    # nginx-Standardmeldung.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag $robots_tag always;
    }

    # Gehashte Build-Assets dürfen unbegrenzt gecacht werden.
    # add_header vererbt sich nicht in Blöcke mit eigenem add_header,
    # deshalb steht X-Robots-Tag hier noch einmal.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag $robots_tag always;
    }

    # Selbst gehostete Fonts
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag $robots_tag always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
    gzip_min_length 1024;
}
